name: Banco de Dados CI

on:
  pull_request:
    paths:
      - "database/**"
      - "docker-compose.yml"
      - ".github/workflows/database.yml"
  push:
    branches:
      - main
      - develop
    paths:
      - "database/**"
      - "docker-compose.yml"
      - ".github/workflows/database.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-compose:
    name: Schema, dados e demonstração (MySQL 8)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Subir o banco com docker compose
        run: docker compose up -d --wait --wait-timeout 300 banco

      - name: Conferir que as 11 tabelas existem
        run: |
          total=$(docker compose exec -T banco mysql -utrama -ptrama -N -e \
            "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = 'confeccoes' AND table_type = 'BASE TABLE'" 2>/dev/null)
          echo "Tabelas no banco confeccoes: $total"
          test "$total" -eq 11

      - name: Conferir que todas as tabelas têm dados
        run: |
          falhou=0
          for tabela in cidade confeccao usuario categoria importacao lancamento_mensal \
                        cenario_concorrencia relatorio item_relatorio entrevista historico_lancamento; do
            linhas=$(docker compose exec -T banco mysql -utrama -ptrama confeccoes -N -e "SELECT COUNT(*) FROM $tabela" 2>/dev/null)
            echo "$tabela: $linhas linhas"
            if [ -z "$linhas" ] || [ "$linhas" -eq 0 ]; then falhou=1; fi
          done
          exit $falhou

      - name: Conferir views, procedures e triggers
        run: |
          docker compose exec -T banco mysql -utrama -ptrama confeccoes -e "
            SELECT COUNT(*) AS linhas_vw_lancamentos FROM vw_lancamentos;
            SELECT COUNT(*) AS linhas_vw_historico_lancamento FROM vw_historico_lancamento;
            SELECT routine_name AS procedures FROM information_schema.routines WHERE routine_schema = 'confeccoes';
            SELECT trigger_name AS triggers FROM information_schema.triggers WHERE trigger_schema = 'confeccoes';" 2>/dev/null
          procedures=$(docker compose exec -T banco mysql -utrama -ptrama -N -e \
            "SELECT COUNT(*) FROM information_schema.routines WHERE routine_schema = 'confeccoes'" 2>/dev/null)
          triggers=$(docker compose exec -T banco mysql -utrama -ptrama -N -e \
            "SELECT COUNT(*) FROM information_schema.triggers WHERE trigger_schema = 'confeccoes'" 2>/dev/null)
          test "$procedures" -eq 7 && test "$triggers" -eq 2

      - name: Rodar os casos de teste da demonstração
        run: |
          docker compose exec -T banco mysql -utrama -ptrama confeccoes \
            < database/tests/teste_demonstracao_projetai.sql 2>/dev/null | tee resultado.txt
          falhas=$(tail -n 1 resultado.txt | awk '{print $3}')
          test "$falhas" -eq 0

      - name: Mostrar o log do MySQL se algo falhar
        if: failure()
        run: |
          docker compose ps
          docker compose logs banco

      - name: Derrubar o banco
        if: always()
        run: docker compose down -v
