name: Front-end CI

on:
  pull_request:
    paths:
      - "Front-end/**"
      - ".github/workflows/front-end.yml"
  push:
    branches:
      - main
    paths:
      - "Front-end/**"
      - ".github/workflows/front-end.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-typecheck-build:
    name: Lint, typecheck e build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Front-end/Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Front-end/Frontend/package-lock.json
      - name: Instalar dependências
        run: npm ci
      - name: Lint
        run: npm run lint --prefix apps/web
      - name: Typecheck
        run: npm run typecheck --prefix apps/web
      - name: Build
        run: npm run build --prefix apps/web
