name: Front-end CI

on:
  pull_request:
    paths:
      - "frontend/**"
      - "docs/api/openapi.json"
      - ".github/workflows/frontend.yml"
  push:
    branches:
      - main
      - develop
    paths:
      - "frontend/**"
      - "docs/api/openapi.json"
      - ".github/workflows/frontend.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-typecheck-build:
    name: Lint, typecheck e build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependências
        run: npm ci
      - name: Conferir os tipos gerados do contrato da API
        run: |
          npm run api:types
          git diff --exit-code -- src/types/api.gen.ts
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Testes (Vitest)
        run: npm test
      - name: Build
        run: npm run build
