services:
  banco:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: confeccoes
      MYSQL_USER: trama
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-trama}
      TZ: America/Recife
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - ./Banco-de-Dados/database/banco_completo.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - trama_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysql", "-h", "127.0.0.1", "-utrama", "-p${MYSQL_PASSWORD:-trama}", "-e", "SELECT 1 FROM confeccoes.lancamento_mensal LIMIT 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  api:
    build: ./Back-end
    depends_on:
      banco:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:mysql://banco:3306/confeccoes?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Recife&characterEncoding=UTF-8
      DB_USERNAME: trama
      DB_PASSWORD: ${MYSQL_PASSWORD:-trama}
      TRAMA_JWT_SECRET: ${TRAMA_JWT_SECRET:-trama-docker-demo-secret-troque-antes-de-publicar-2026}
      TRAMA_CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf \"GET /api/health HTTP/1.0\\r\\n\\r\\n\" >&3 && grep -q 200 <&3'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  web:
    build:
      context: ./Front-end/Frontend
      args:
        VITE_API_URL: http://localhost:8080
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  trama_mysql:
