services:
  banco:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: confeccoes
      MYSQL_USER: trama
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-trama}
      TZ: America/Recife
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci --log-bin-trust-function-creators=1
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - trama_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-utrama", "-p${MYSQL_PASSWORD:-trama}", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  api:
    build: ./backend
    depends_on:
      banco:
        condition: service_healthy
    environment:
      TZ: America/Recife
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:mysql://banco:3306/confeccoes?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Recife&characterEncoding=UTF-8
      DB_USERNAME: trama
      DB_PASSWORD: ${MYSQL_PASSWORD:-trama}
      TRAMA_JWT_SECRET: ${TRAMA_JWT_SECRET:-trama-docker-demo-secret-troque-antes-de-publicar-2026}
      TRAMA_CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf \"GET /api/health HTTP/1.0\\r\\n\\r\\n\" >&3 && grep -q 200 <&3'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  seed:
    image: mysql:8.0
    depends_on:
      api:
        condition: service_healthy
    environment:
      MYSQL_PWD: ${MYSQL_PASSWORD:-trama}
    volumes:
      - ./database:/database:ro
    entrypoint: ["sh", "-c"]
    command:
      - |
        # A view da demonstração é o último objeto criado: se ela existe, a carga terminou.
        carregado=$$(mysql -h banco -utrama -N -e "SELECT COUNT(*) FROM information_schema.views WHERE table_schema = 'confeccoes' AND table_name = 'vw_serie_polo_regional'") || exit 1
        confeccoes=$$(mysql -h banco -utrama -N -e 'SELECT COUNT(*) FROM confeccoes.confeccao') || exit 1
        if [ "$$carregado" = "1" ]; then
          echo "Os dados de exemplo já foram carregados; seed ignorado."
        elif [ "$$confeccoes" = "0" ]; then
          for arquivo in seeds/inserts.sql tests/teste_triggers.sql queries/transacoes.sql seeds/seed_demonstracao_projetai.sql; do
            mysql -h banco -utrama --default-character-set=utf8mb4 confeccoes < /database/$$arquivo > /dev/null || exit 1
          done &&
          echo "Dados de exemplo e demonstração carregados."
        else
          echo "O banco tem dados, mas o seed não terminou. Recrie com: docker compose down -v (apaga os dados)." >&2
          exit 1
        fi

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8080
    depends_on:
      seed:
        condition: service_completed_successfully
    ports:
      - "3000:3000"

volumes:
  trama_mysql:
