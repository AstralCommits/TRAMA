server:
  port: ${PORT:8080}
  error:
    include-message: never

spring:
  application:
    name: trama-backend
  profiles:
    default: local
  jpa:
    open-in-view: false
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

trama:
  cors:
    allowed-origins: ${TRAMA_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  jwt:
    secret: ${TRAMA_JWT_SECRET:}
    expiration-ms: ${TRAMA_JWT_EXPIRATION_MS:86400000}
  cadastro:
    max-por-hora: ${TRAMA_CADASTRO_MAX_POR_HORA:5}
  login:
    max-tentativas: ${TRAMA_LOGIN_MAX_TENTATIVAS:5}
    bloqueio-minutos: ${TRAMA_LOGIN_BLOQUEIO_MINUTOS:15}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    env:
      enabled: true

info:
  app:
    name: TRAMA
    version: '@project.version@'

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs
