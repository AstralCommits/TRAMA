name: TRAMA — CI do monorepositório

on:
  push:
    branches: [develop]
    paths:
      - 'Frontend/**'
      - 'Back-end/**'
      - 'Banco-de-Dados/**'
      - 'docs/**'
      - 'scripts/**'
      - 'package.json'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [develop]
    paths:
      - 'Frontend/**'
      - 'Back-end/**'
      - 'Banco-de-Dados/**'
      - 'docs/**'
      - 'scripts/**'
      - 'package.json'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

jobs:
  frontend:
    name: Front-end — Node 22.22+
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - name: Instalar dependências
        run: npm ci --prefix Frontend
      - name: Verificar estrutura do monorepo
        run: npm run qa:package
      - name: Verificar contratos integrados
        run: npm run qa:contracts
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  backend:
    name: Back-end — Java 21 / Maven
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: Back-end/pom.xml
      - name: Permitir execução do Maven Wrapper
        run: chmod +x Back-end/mvnw
      - name: Testes e verificação
        run: ./Back-end/mvnw --batch-mode --no-transfer-progress -Dspring.profiles.active=local clean verify
      - name: Publicar relatórios de teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            Back-end/target/surefire-reports/
            Back-end/target/site/jacoco/
          if-no-files-found: ignore
          retention-days: 14
