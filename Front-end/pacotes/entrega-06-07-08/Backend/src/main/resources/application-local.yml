spring:
  datasource:
    url: jdbc:h2:mem:trama;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: false
  h2:
    console:
      enabled: false

logging:
  level:
    org.hibernate.SQL: warn

trama:
  auth:
    jwt-secret: ${TRAMA_JWT_SECRET:VGhpcy1pcy1hLWRldi1vbmx5LXRyYW1hLWtleS1jaGFuZ2UtbWUtMjAyNg==}
    cookie-secure: false
    cookie-same-site: Lax
