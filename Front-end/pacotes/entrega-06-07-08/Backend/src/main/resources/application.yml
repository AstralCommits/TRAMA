server:
  port: ${PORT:8080}
  error:
    include-message: never

spring:
  application:
    name: trama-backend
  profiles:
    default: local
  jpa:
    open-in-view: false
  jackson:
    default-property-inclusion: non_null

trama:
  cors:
    allowed-origins: ${TRAMA_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  auth:
    jwt-secret: ${TRAMA_JWT_SECRET:}
    token-hours: ${TRAMA_JWT_HOURS:12}
    cookie-secure: ${TRAMA_AUTH_COOKIE_SECURE:false}
    cookie-same-site: ${TRAMA_AUTH_COOKIE_SAME_SITE:Lax}
  admin:
    email: ${TRAMA_ADMIN_EMAIL:}
    password: ${TRAMA_ADMIN_PASSWORD:}
    name: ${TRAMA_ADMIN_NAME:Administrador TRAMA}
