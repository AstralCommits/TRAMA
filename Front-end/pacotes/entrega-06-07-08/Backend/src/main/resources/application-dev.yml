spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/confeccoes?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Recife&characterEncoding=UTF-8}
    username: ${DB_USERNAME:trama}
    password: ${DB_PASSWORD:trama_dev_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

trama:
  auth:
    jwt-secret: ${TRAMA_JWT_SECRET:}
    cookie-secure: ${TRAMA_AUTH_COOKIE_SECURE:false}
    cookie-same-site: ${TRAMA_AUTH_COOKIE_SAME_SITE:Lax}
