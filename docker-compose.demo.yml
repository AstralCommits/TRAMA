# Demonstração pública: o mesmo ambiente do docker-compose.yml (perfil dev, dados
# de exemplo e usuários de demonstração) num único endereço com HTTPS.
#
#   docker compose -f docker-compose.yml -f docker-compose.demo.yml --profile proxy up -d --build --wait
#
# Com --profile proxy, um Caddy no Docker ocupa as portas 80 e 443 e emite o certificado.
# Sem ele, a API e o front ficam em 127.0.0.1:18080 e 127.0.0.1:13000 para um proxy
# que já exista no servidor (veja deploy/demo/Caddyfile.externo).
#
# Precisa de um .env com TRAMA_DOMINIO, MYSQL_ROOT_PASSWORD, MYSQL_PASSWORD e
# TRAMA_JWT_SECRET (o deploy/demo/subir.sh cria um com senhas aleatórias).
# Os usuários de demonstração têm senha pública: não use para dados reais.

name: trama-demo

services:
  banco:
    restart: unless-stopped
    ports: !reset []

  api:
    restart: unless-stopped
    environment:
      TRAMA_CORS_ALLOWED_ORIGINS: https://${TRAMA_DOMINIO:?Defina TRAMA_DOMINIO no .env}
      TRAMA_JWT_SECRET: ${TRAMA_JWT_SECRET:?Defina TRAMA_JWT_SECRET no .env}
      JAVA_OPTS: -XX:MaxRAMPercentage=50 -XX:+ExitOnOutOfMemoryError
      # A API só é alcançada pelo proxy, que repassa o IP real no X-Forwarded-For;
      # sem isso o limite de cadastros por conexão vale para todos os visitantes juntos.
      SERVER_FORWARD_HEADERS_STRATEGY: framework
    ports: !override
      - "127.0.0.1:${DEMO_API_PORT:-18080}:8080"

  web:
    restart: unless-stopped
    build:
      args:
        VITE_API_URL: https://${TRAMA_DOMINIO}
    ports: !override
      - "127.0.0.1:${DEMO_WEB_PORT:-13000}:3000"

  proxy:
    profiles: [proxy]
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_started
    environment:
      TRAMA_DOMINIO: ${TRAMA_DOMINIO}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
